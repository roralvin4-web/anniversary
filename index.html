<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 1 Year & 8 Months Anniversary! ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .emoji {
            font-size: 70px;
            margin-bottom: 15px;
        }
        .text {
            font-size: 17px;
            color: #4a4a4a;
            line-height: 1.6;
            margin-bottom: 25px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button {
            background-color: #ff6b81;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 107, 129, 0.4);
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="card">
    <div class="emoji" id="emojiDisplay">🌹</div>
    <div class="text" id="textDisplay">ချစ်တုံးလေးရေ ကိုးကို စုစုကို စိတ်ကောက်အောင်ထားထားတာမဟုတ်ပါဘူးဗျာ</div>
    <button onclick="nextStep()" id="nextBtn">ရှေ့ဆက်သွားရန် ❤️</button>
</div>

<script>
    const steps = [
        {
            emoji: "✨",
            text: "ဒီနေ့က ကိုးကိုတို့ရဲ့  ချစ်သူသက်တမ်း ၁ နှစ်နဲ့ ၈ လ (ရက်ပေါင်း ၆၀၀ ကျော်) ပြည့်တဲ့ Anniversary လေးပါ။"
        },
        {
            emoji: "⏳",
            text: "အတူတူဖြတ်သန်းခဲ့တဲ့ အချိန်တိုင်းမှာ အခက်အခဲတွေ ရှိခဲ့ပေမယ့် စုနဲ့တူတူရှိနေရတာဟာ ကို့တွက် အပျော်ဆုံးပဲ။"
        },
        {
            emoji: "🥰",
            text: "ကို့ကို ဂရုစိုက်ပေးပြီး အမြဲနားလည်ပေးလို့လည်း ကျေးဇူးအများကြီးတင်ပါတယ်နော်။"
        },
        {
            emoji: "💍",
            text: "ရှေ့ဆက်ပြီးတော့လည်း ဒီထက်မက ခိုင်မြဲတဲ့ အချစ်တွေနဲ့ အတူတူ လက်တွဲသွားကြမယ်နော်!"
        },
        {
            emoji: "💖",
            text: "Happy 1 Year & 8 Months Anniversary ပါ ချစ်သူလေး! အများကြီးချစ်တယ်နော်။"
        }
    ];

    let currentStep = 0;

    function nextStep() {
        if (currentStep < steps.length) {
            document.getElementById('emojiDisplay').textContent = steps[currentStep].emoji;
            document.getElementById('textDisplay').textContent = steps[currentStep].text;
            currentStep++;

            if (currentStep === steps.length) {
                document.getElementById('nextBtn').textContent = "ပြန်စရန် 🔄";
            }
        } else {
            currentStep = 0;
            document.getElementById('emojiDisplay').textContent = "🌹";
            document.getElementById('textDisplay').textContent = "";
            document.getElementById('nextBtn').textContent = "ရှေ့ဆက်သွားရန် ❤️";
        }
    }
</script>

</body>
</html>
